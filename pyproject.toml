[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cotlab"
dynamic = ["version"]
description = "CoTLab - Chain of Thought Research Toolkit for LLMs"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Huseyin Cavus", email = "huseyincavus@proton.me" }
]
keywords = ["chain-of-thought", "interpretability", "mechanistic-interpretability", "llm", "medical-ai", "probing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "click>=8.1.0",
    "torch>=2.1.0",
    "transformers>=4.56.0,<5",
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
    "accelerate>=0.27.0",
    "safetensors>=0.4.0",
    "huggingface-hub>=0.20.0",
    "numpy>=1.24.0",
    "tqdm>=4.65.0",
    "python-dotenv>=1.0.0",
    "scikit-learn>=1.3.0",
    "xmltodict>=0.13.0",
    "defusedxml>=0.7.1",
    "bitsandbytes>=0.46.1",
    "pyarrow>=14.0.0",
    "pandas>=2.0.0",
    "protobuf>=3.20.0",
]

[project.optional-dependencies]
# vLLM is installed separately based on GPU:
# - NVIDIA: pip install vllm
# - AMD ROCm: Use Docker (./scripts/cotlab-rocm.sh)
vllm = [
    "vllm>=0.6.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.4.4",
    "mypy>=1.0.0",
    "ipython>=8.0.0",
    "jupyter>=1.0.0",
    "pre-commit>=3.0.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.4.0",
    "mkdocstrings[python]>=0.23.0",
]

[project.urls]
Repository = "https://github.com/huseyincavusbi/CoTLab"
Documentation = "https://huseyincavusbi.github.io/CoTLab"
Issues = "https://github.com/huseyincavusbi/CoTLab/issues"

[project.scripts]
cotlab = "cotlab.main:main"
cotlab-template = "cotlab.cli:cli"

[tool.hatch.version]
path = "src/cotlab/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/cotlab"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501", "F821"]  # F821 = undefined name (for forward refs)

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = false
warn_return_any = false
warn_unused_ignores = false
no_implicit_optional = false
