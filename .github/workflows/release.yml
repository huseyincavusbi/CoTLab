name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04-arm
    environment: release
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Display system information
        run: |
          echo "OS Information:"
          uname -a
          echo ""
          echo "CPU Information:"
          nproc 2>/dev/null || sysctl -n hw.ncpu
          echo "CPU Details:"
          if [ "$RUNNER_OS" = "macOS" ]; then
            sysctl -n machdep.cpu.brand_string 2>/dev/null
            echo "CPU cores: $(sysctl -n hw.ncpu)"
          else
            lscpu | head -10
          fi
          echo ""
          echo "Memory Information:"
          if [ "$RUNNER_OS" = "macOS" ]; then
            vm_stat | head -5
          else
            free -h | awk '/^Mem:/{print "Memory: " $2}'
            free -h | awk '/^Swap:/{print "Swap: " $2}'
          fi
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v5

      - name: Build
        run: uv build

      - name: Publish to PyPI
        run: uv publish
        # Uses OIDC trusted publishing — no token needed if configured on PyPI

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v2
        with:
          draft: false
          generate_release_notes: true
          files: dist/*
