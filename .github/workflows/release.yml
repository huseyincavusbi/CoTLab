name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04-arm
    environment: release
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Display system information
        run: |
          echo "OS Information:"
          uname -a
          echo ""
          echo "CPU Information:"
          nproc 2>/dev/null || sysctl -n hw.ncpu
          echo "CPU Details:"
          if [ "$RUNNER_OS" = "macOS" ]; then
            sysctl -n machdep.cpu.brand_string 2>/dev/null
            echo "CPU cores: $(sysctl -n hw.ncpu)"
          else
            lscpu | head -10
          fi
          echo ""
          echo "Memory Information:"
          if [ "$RUNNER_OS" = "macOS" ]; then
            vm_stat | head -5
          else
            free -h | awk '/^Mem:/{print "Memory: " $2}'
            free -h | awk '/^Swap:/{print "Swap: " $2}'
          fi
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v5

      - name: Build
        run: uv build

      - name: Publish to PyPI
        run: uv publish
        # Uses OIDC trusted publishing — no token needed if configured on PyPI

      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v2
        with:
          generate_release_notes: true
          files: dist/*
