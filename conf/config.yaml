defaults:
  - backend: vllm
  - model: google/gemma-3-270m-it
  - prompt: chain_of_thought
  - dataset: synthetic
  - experiment: cot_faithfulness
  - _self_

# Global settings
seed: 42
verbose: true
dry_run: false

# Output configuration
hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}_${experiment.name}_${dataset.name}_${prompt.name}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  output_subdir: null
