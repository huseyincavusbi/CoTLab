# Activation Compare — collect mean residual-stream vectors for one condition.
# Compare two or more saved runs offline with scripts/compare_activations.py
_target_: cotlab.experiments.ActivationCompareExperiment

name: activation_compare
description: Collect mean layer activations for representational comparison

layer_stride: 2        # stride 2 → even layers (informative for Gemma3 interleaved attn)
num_samples: 50
pooling: last_token    # last_token | mean
max_input_tokens: 1024
seed: 42
answer_cue: "\n\nAnswer:"
batch_size: 1          # samples per forward pass
