# Attention Analysis Experiment
_target_: cotlab.experiments.AttentionAnalysisExperiment

name: attention_analysis
description: "Analyze attention patterns at critical layers"

# Layer selection (choose ONE approach):
# - Use all_layers: true to analyze all model layers (0 to N-1) with optional stride
# - Use all_layers: false and specify target_layers list for specific layers
all_layers: true  # Analyze all layers
target_layers: null  # e.g. [55, 56, 57, 58, 59, 60, 61] when all_layers=false
layer_stride: 1  # Step between layers when all_layers=true. E.g. 3 → layers 0,3,6,9,...

# NOTE: For attention analysis, use bfloat16 (not float16) to avoid NaN in deeper layers!
# Run with: backend.dtype=bfloat16

force_eager_reload: false  # Set to false to avoid OOM; uses in-place attention switch
num_samples: null  # null = use all available samples from the dataset
last_k_tokens: 16  # Secondary span metric for mean entropy over trailing prompt tokens
max_input_tokens: 1024  # Safety cap to prevent OOMs
analyze_generated_tokens: false  # If true, also analyze attentions while generating answers
generated_max_new_tokens: 16  # Keep small to control memory usage
generated_do_sample: false  # Use deterministic generation for stable comparisons
generated_temperature: 0.7  # Used only when generated_do_sample=true
generated_top_p: 0.9  # Used only when generated_do_sample=true
question: "Patient presents with chest pain, sweating, and shortness of breath. What is the diagnosis?"

batch_size: 1  # Override with experiment.batch_size=8 or higher
