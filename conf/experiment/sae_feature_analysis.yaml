# SAE Feature Analysis — GemmaScope-2 histopathology feature identification
#
# Phase 1 (always): vocab probing — which features fire on histo terms?
# Phase 2 (optional): few-shot contrast — do those features activate more
#   with in-context histopathology exemplars vs. zero-shot?
_target_: cotlab.experiments.SAEFeatureAnalysisExperiment

name: sae_feature_analysis
description: "GemmaScope-2 histo feature identification and few-shot contrast"

sae_repo_id: google/gemma-scope-2-27b-it
sae_site: resid_post_all   # alternatives: resid_post, attn_out_all, mlp_out_all
sae_width: 16k             # 16k | 262k
sae_l0: small              # small (<30) | medium (30-90) | big (>90)

target_layers: null        # null = all layers; override e.g. [24,25,26,27,28]

top_k_features: 20
# histo_vocab: null         # null = built-in 25-term list

few_shot_contrast: true
num_samples: 50
seed: 42
max_input_tokens: 1024
answer_cue: "\n\nAnswer:"
