# Confidence Regulation — entropy-neuron identification/mediation/overlap
# (Stolfo et al., NeurIPS 2024, arXiv:2406.16254)
_target_: cotlab.experiments.ConfidenceRegulationExperiment

name: confidence_regulation
description: "Entropy-neuron identification and mediation (Stolfo et al., NeurIPS 2024)"

# identify | mediate | overlap | full (mediate/overlap land in follow-up commits)
mode: identify

# top_n | top_percent (ranking metric: rho, per the authors' released code)
selection: top_n
top_n: 20
top_percent: 0.01

# Bottom-k right singular vectors of W_U treated as the effective null space.
# null defaults to max(1, round(0.01 * d_model)) — 12 for GPT-2 Small,
# 25 for Gemma 3 4B (d_model=2560), 40 for LLaMA2 7B.
k_null: null

# Neuron chunk size for the (vocab x chunk) LogitVar projection matmuls.
logit_chunk_size: 256

# --- mediate mode ---
# Corpus for mean activations; null uses an embedded default text
# (original work used C4 — approximation, see module docstring).
corpus_text: null
n_tokens: 8192
seq_len: 256
mediate_sequences: 8
# candidates = identified set + random baseline (CPU-friendly); "all" sweeps
# every final-layer neuron like the authors.
mediate_scope: candidates
mediate_neuron_chunk: 16
random_baseline_count: 20

# --- overlap mode ---
# Probe JSON with H-Neuron indices (legacy "neurons" or "fit.h_neurons" format).
probe_path: null

# --- neuron family ---
# entropy: null-space rho ranking + DE with frozen LayerNorm scale (Eq. 6)
# frequency: |cosine(write, v_freq)| ranking + DE with v_freq component
# restored (Eq. 7); unigram_path points to a .npy of unigram counts
# (e.g. the authors' OpenWebText file) — null derives counts from the corpus.
neuron_family: entropy
unigram_path: null

# Analysis layer: null = final layer. Non-final layers support identify
# (weight-space descriptors) and forward-engine mediate (in-situ |dLoss|);
# the analytic engine raises for non-final layers (pathway decomposition
# is only valid where MLP output feeds the final norm directly).
layer: null

# Fold the final-norm gain into W_U before SVD/LogitVar (paper Sec. 2;
# TransformerLens fold_ln equivalent). Required for correct null-space
# identification — without it GPT-2 Small reproduction drops to 1/6.
fold_final_norm: true

seed: 42

# --- induction function mode (Sec. 6) ---
# Duplicated-sequence hedging test: entropy trajectory across first/second
# occurrence + clip-to-first-occurrence-mean ablation per candidate neuron.
induction_half_len: 100
induction_sequences: 6
